<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BYD Charging Calculator V6</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Orbitron:wght@500;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#8A6E2F;--bg:#0A0A0A;--d1:#111;--d2:#1A1A1A;--d3:#222;--text:#F0E6CC;--dim:#9A8A6A;--ok:#8CD978;--warn:#FF9966;--bad:#FF6B6B;--g-rgb:201,168,76;--w-rgb:255,255,255;--on-gold:#0A0A0A;--best-bg:#2b2312;--have-a:#4a3d1c;--glow:#1a1200;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
body{background-color:var(--bg);color:var(--text);font:16px 'Sarabun',system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at top,var(--glow) 0%,transparent 60%),repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(var(--g-rgb),.03) 40px,rgba(var(--g-rgb),.03) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(var(--g-rgb),.03) 40px,rgba(var(--g-rgb),.03) 41px)}
.container{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.header{text-align:center;padding:24px 0}
.header::after{content:'';display:block;width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0}
.car-icon{width:min(300px,86%);aspect-ratio:2/1;margin:0 auto 4px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}.car-icon img{display:block;width:100%;height:100%;object-fit:contain}.car-icon img[hidden]{display:none}.carsel{display:flex;gap:8px;margin-bottom:6px}
h1{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold-l);letter-spacing:2px;text-shadow:0 0 20px rgba(var(--g-rgb),.4)}
.subtitle{font-size:.8rem;color:var(--dim);margin-top:4px;letter-spacing:1px}
.pill{display:inline-block;background:rgba(var(--g-rgb),.08);border:1px solid rgba(var(--g-rgb),.2);border-radius:20px;padding:4px 14px;font-size:.75rem;color:var(--gold);margin-top:10px}
.card{background:linear-gradient(135deg,var(--d2),var(--d3));border:1px solid rgba(var(--g-rgb),.25);border-radius:16px;padding:22px 20px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(var(--g-rgb),.1)}
.field{margin-bottom:18px}.field:last-child{margin-bottom:0}
.field-label{display:block;font-size:.85rem;font-weight:500;color:var(--gold-l);margin-bottom:8px}
input[type=number],input[type=time]{width:100%;background:var(--d1);border:1px solid rgba(var(--g-rgb),.3);border-radius:10px;padding:13px 16px;font:inherit;font-size:1.1rem;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s,opacity .2s;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--g-rgb),.15)}
input::placeholder{color:var(--dim)}
input:disabled{opacity:.35;cursor:not-allowed}
.err{color:var(--bad);font-size:.78rem;margin-top:6px;min-height:0}.err:empty{display:none}
.chips{display:flex;gap:8px}
.chip{flex:1;padding:12px 0;border-radius:8px;border:1px solid rgba(var(--g-rgb),.3);background:var(--d1);color:var(--dim);font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.chip:focus-visible,.row:focus-visible,.refresh:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;margin-top:10px;cursor:pointer;user-select:none;position:relative}
.check input{position:absolute;opacity:0;width:20px;height:20px;margin:0}
.box{width:20px;height:20px;border:2px solid rgba(var(--g-rgb),.5);border-radius:6px;background:var(--d1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;font-size:.75rem;font-weight:900;transition:all .2s}
.check input:checked+.box{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.check input:focus-visible+.box{outline:2px solid var(--gold-l);outline-offset:2px}
.check-text{font-size:.85rem;color:var(--dim)}
#results{display:none}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(var(--g-rgb),.3),transparent);margin:4px 0 20px}
.banner{padding:12px 14px;border-radius:12px;font-size:.88rem;line-height:1.45;margin-bottom:14px;border:1px solid}
.banner.good{background:rgba(140,217,120,.08);border-color:rgba(140,217,120,.3);color:var(--ok)}
.banner.warn{background:rgba(255,153,102,.08);border-color:rgba(255,153,102,.3);color:var(--warn)}
.banner.info{background:rgba(var(--g-rgb),.08);border-color:rgba(var(--g-rgb),.25);color:var(--gold-l)}
.c8{--c:#8CD978}.c10{--c:#C9A84C}.c11{--c:#D8B84E}.c12{--c:#E2AE50}.c13{--c:#EBA454}.c14{--c:#F09A58}.c15{--c:#F4905C}.c16{--c:#5BC8F5}.c32{--c:#FF7850}
.item{border:1px solid rgba(var(--g-rgb),.2);border-left:3px solid var(--s,var(--gold-d));border-radius:12px;margin-bottom:10px;background:linear-gradient(135deg,var(--d2),var(--d3));overflow:hidden}
.item.best{background:linear-gradient(135deg,var(--best-bg),var(--d3));animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--gold),0 4px 16px rgba(var(--g-rgb),.18)}50%{box-shadow:0 0 0 1px var(--gold-l),0 4px 28px rgba(var(--g-rgb),.42)}}
.row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;cursor:pointer}
.row:focus-visible{outline:2px solid var(--gold-l);outline-offset:-2px}
.badge{background:var(--c);color:var(--on-gold);font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;padding:4px 10px;border-radius:20px;min-width:54px;text-align:center}
.main{flex:1;min-width:0}
.l1{font-weight:600;font-size:.98rem;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.l2{font-size:.8rem;color:var(--gold);margin-top:2px}
.tag{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tag.best{background:var(--gold);color:var(--on-gold)}
.tag.slack{background:rgba(140,217,120,.15);color:var(--ok)}
.tag.tight{background:rgba(255,153,102,.15);color:var(--warn)}
.tag.late{background:rgba(255,107,107,.15);color:var(--bad)}
.ok{color:var(--ok)}
.chev{color:var(--dim);font-size:.8rem;transition:transform .2s}
.item.open .chev{transform:rotate(180deg)}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.item.open .detail{grid-template-rows:1fr}
.detail-in{overflow:hidden;min-height:0;padding:0 14px}
.drow:first-child{border-top:1px solid rgba(var(--w-rgb),.06)}
.drow{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;padding:8px 0;border-bottom:1px solid rgba(var(--w-rgb),.04)}
.drow:last-child{border-bottom:none}
.drow span:first-child{color:var(--dim)}
.updated{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.75rem;color:var(--dim);margin-top:6px}
.refresh{all:unset;box-sizing:border-box;cursor:pointer;color:var(--gold);padding:4px 10px;border:1px solid rgba(var(--g-rgb),.3);border-radius:14px}
.refresh:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.footer{text-align:center;padding:20px 0 8px;font-size:.68rem;color:rgba(var(--g-rgb),.4);letter-spacing:1px}

.st-ok{--s:var(--ok)}.st-tight{--s:var(--warn)}.st-late{--s:var(--bad)}.st-done{--s:#666}
.l1 .dur,.drow span+span,.mini b{font-family:'Orbitron','Sarabun',sans-serif;font-variant-numeric:tabular-nums}
.l1 .dur{font-size:.9rem;font-weight:500}.l2{font-variant-numeric:tabular-nums}
.badge{color:#0A0A0A}
.drow:first-child{border-top:none}
.tl-wrap{border-top:1px solid rgba(var(--w-rgb),.06);padding:10px 0 6px}
.tl{position:relative;display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgba(var(--w-rgb),.06)}
.tl-w{background:rgba(var(--w-rgb),.12)}.tl-c{background:linear-gradient(90deg,var(--gold-d),var(--gold-l))}.tl-s{background:rgba(140,217,120,.35)}
.tl-t{position:absolute;top:0;bottom:0;width:3px;background:var(--text)}.st-late .tl-t{background:var(--bad)}
.tl-l{display:flex;justify-content:space-between;font-size:.7rem;color:var(--dim);margin-top:4px}
.stepper{display:flex;align-items:center;gap:10px;margin-top:10px}.stepper input{flex:1;accent-color:var(--gold);min-width:0}
.step{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:10px;border:1px solid rgba(var(--g-rgb),.35);background:var(--d1);color:var(--gold-l);text-align:center;font-size:1.3rem;line-height:38px;cursor:pointer}
.step:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.empty{text-align:center;color:var(--dim);font-size:.88rem;line-height:1.6;padding:6px 16px 18px}
.mini{display:none;position:sticky;top:0;z-index:20;margin:0 -16px 6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;text-align:center;font-size:.85rem;color:var(--text);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid rgba(var(--g-rgb),.25)}
.mini b{font-weight:500}
.mini.on{display:block}
.themes{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.themes .chip{flex:0 0 auto;padding:6px 14px;font-size:.78rem}
html[data-theme=ocean]{--gold:#2EC4B6;--gold-l:#8CF0E4;--gold-d:#1B7F7A;--g-rgb:46,196,182;--bg:#06141A;--d1:#0A1D25;--d2:#0F2B35;--d3:#13373F;--text:#E2F6F4;--dim:#80A9AB;--on-gold:#04141A;--best-bg:#0F3A40;--have-a:#124B4F;--glow:#08303A}
html[data-theme=light]{color-scheme:light;--gold:#8F6A12;--gold-l:#6F5010;--gold-d:#C9A84C;--g-rgb:143,106,18;--w-rgb:0,0,0;--bg:#F6F1E4;--d1:#FFFFFF;--d2:#FBF7EC;--d3:#F1E9D3;--text:#2A2412;--dim:#6B5E3E;--on-gold:#FFFFFF;--best-bg:#FFF1C7;--have-a:#E3D3A0;--glow:#EFE3BF;--ok:#2E7D32;--warn:#B85410;--bad:#C62828}
html[data-theme=amoled]{--bg:#000;--d1:#000;--d2:#0B0B0B;--d3:#101010;--glow:#000}
html[data-theme=amoled] body{background-image:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      <div class="chips" id="chips" role="group" aria-labelledby="tgt-l">
        <button type="button" class="chip" data-v="80">80% · ใช้งานปกติ</button>
        <button type="button" class="chip" data-v="100">100% · เต็ม</button>
      </div>
      <div class="err" id="err-t" role="alert"></div>
    </div>

    <div class="field">
      <label class="field-label" for="target-time">⏰ เวลาที่ต้องการชาร์จเสร็จ</label>
      <input type="time" id="target-time" value="08:00">
      <label class="check">
        <input type="checkbox" id="no-time">
        <span class="box">✓</span>
        <span class="check-text">ไม่ระบุเวลาชาร์จเสร็จ</span>
      </label>
    </div>
  </div>

  <div class="empty" id="empty">กรอกแบตฯ ที่เหลืออยู่ หรือเลื่อนแถบด้านบน<br>แล้วจะบอกว่าควรชาร์จกี่แอมป์ 🔋</div>

  <div id="results">
    <div class="divider"></div>
    <div class="banner" id="banner"></div>
    <div id="list"></div>
    <div class="updated"><span id="upd"></span><button type="button" class="refresh" id="refresh" aria-label="คำนวณใหม่จากเวลาปัจจุบัน">↻ อัปเดต</button></div>
  </div>

  <div class="themes" id="themes" role="group" aria-label="ธีม"><button type="button" class="chip" data-th="gold">ทอง</button><button type="button" class="chip" data-th="ocean">ทะเล</button><button type="button" class="chip" data-th="light">สว่าง</button><button type="button" class="chip" data-th="amoled">ดำสนิท</button></div>
  <div class="footer">Created by nutwinspector with Claude · V6</div>
</div>

<script>
const CARS = {
  dolphin: { name: 'BYD DOLPHIN Std.', batt: 50.25 },
  atto3:   { name: 'BYD ATTO 3 Ext.',  batt: 60.48 }
};
let car = 'dolphin', BATT = CARS.dolphin.batt;
const CH = [
  { a: 8,  kw: 1.2, c: 'c8',  i: '🐌' },
  { a: 10, kw: 1.7, c: 'c10', i: '🐢' },
  { a: 11, kw: 1.9, c: 'c11', i: '🚶' },
  { a: 12, kw: 2.2, c: 'c12', i: '🚲' },
  { a: 13, kw: 2.3, c: 'c13', i: '🛵' },
  { a: 14, kw: 2.6, c: 'c14', i: '🚗' },
  { a: 15, kw: 2.8, c: 'c15', i: '🏎️' },
  { a: 16, kw: 2.9, c: 'c16', i: '✈️' },
  { a: 32, kw: 6.2, c: 'c32', i: '🚀' }
];
const KEY = 'byd_calc_v4';
const $ = id => document.getElementById(id);
let open = new Set();

const p2 = n => String(n).padStart(2, '0');
const hm = d => p2(d.getHours()) + ':' + p2(d.getMinutes());
function dur(min) {
  const h = Math.floor(min / 60), m = min % 60;
  if (!h) return m + ' นาที';
  if (!m) return h + ' ชม.';
  return h + ' ชม. ' + m + ' นาที';
}
function dayTag(d, now) {
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const n = Math.round((a - b) / 864e5);
  return n <= 0 ? '' : n === 1 ? ' (พรุ่งนี้)' : ' (+' + n + ' วัน)';
}
const when = (d, now) => hm(d) + ' น.' + dayTag(d, now);

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('.themes .chip').forEach(b => b.classList.toggle('on', b.dataset.th === t));
  try { localStorage.setItem('byd_theme', t); } catch (e) {}
}
let hasRes = false;
const updMini = () => $('mini').classList.toggle('on', hasRes);

function setCar(id) {
  if (!CARS[id]) id = 'dolphin';
  car = id; BATT = CARS[id].batt;
  $('car-name').textContent = CARS[id].name;
  $('batt-pill').textContent = '🔋 Battery ' + BATT + ' kWh';
  document.querySelectorAll('.car-icon img').forEach(i => { i.hidden = i.dataset.car !== id; });
  document.querySelectorAll('#carsel .chip').forEach(b => {
    const on = b.dataset.car === id;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      b: $('battery').value, t: $('tgt').value, tm: $('target-time').value,
      nt: $('no-time').checked, o: [...open], c: car
    }));
  } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!s) return;
    $('battery').value = s.b || '';
    $('tgt').value = s.t === '100' ? '100' : '80';
    if (s.tm) $('target-time').value = s.tm;
    $('no-time').checked = !!s.nt;
    open = new Set((s.o || []).slice(0, 1));
    if (s.c) car = s.c;
  } catch (e) {}
}

function calc(scroll) {
  const bv = $('battery').value, tv = $('tgt').value;
  const b = parseFloat(bv), t = parseFloat(tv);
  $('b-range').value = isFinite(b) ? Math.min(90, Math.max(0, b)) : 0;
  const noT = $('no-time').checked, tt = $('target-time').value;

  $('err-b').textContent = bv !== '' && !(b >= 0 && b <= 99) ? 'กรุณากรอกระดับแบตเตอรี่ 0–99%' : '';
  $('err-t').textContent = !(t >= 1 && t <= 100) ? 'กรุณากรอกเป้าหมาย 1–100%' : '';
  $('target-time').disabled = noT;
  document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', parseFloat(c.dataset.v) === t));
  save();

  if ($('err-b').textContent || $('err-t').textContent || bv === '' || (!noT && !tt)) {
    $('results').style.display = 'none';
    $('empty').style.display = 'block';
    hasRes = false; updMini();
    return;
  }

  const now = new Date(); now.setSeconds(0, 0);
  const need = Math.max(0, BATT * (t - b) / 100);

  let target = null;
  if (!noT) {
    const [h, m] = tt.split(':').map(Number);
    target = new Date(now); target.setHours(h, m, 0, 0);
    if (target <= now) target.setDate(target.getDate() + 1);
  }

  const rows = CH.map(c => {
    const mins = Math.round(need / c.kw * 60);
    const r = { c, mins, done: need === 0, ok: true };
    if (r.done) return r;
    if (noT) {
      r.start = now; r.end = new Date(now.getTime() + mins * 6e4);
    } else {
      const s = new Date(target.getTime() - mins * 6e4);
      if (s >= now) { r.start = s; r.end = target; }
      else { r.ok = false; r.start = now; r.end = new Date(now.getTime() + mins * 6e4); }
    }
    return r;
  });

  const best = (!noT && need > 0) ? rows.find(r => r.ok) : null;
  const avail = noT ? 0 : Math.round((target - now) / 6e4);

  const pc = n => +n.toFixed(1) + '%';
  const tlHtml = r => {
    const end = r.end, tot = Math.max(end, target || end) - now;
    if (tot <= 0) return '';
    const w = x => (x / tot * 100).toFixed(1) + '%';
    const sk = target && target > end ? target - end : 0;
    return '<div class="tl-wrap"><div class="tl"><span class="tl-w" style="width:' + w(r.start - now) + '"></span><span class="tl-c" style="width:' + w(end - r.start) + '"></span><span class="tl-s" style="width:' + w(sk) + '"></span>' +
      (target ? '<i class="tl-t" style="left:calc(' + w(target - now) + ' - 3px)"></i>' : '') + '</div><div class="tl-l"><span>ตอนนี้ ' + hm(now) + '</span><span>' + (target ? 'เป้า ' + hm(target) : 'เสร็จ ' + hm(end)) + '</span></div></div>';
  };
  {
    let dot = '', txt;
    if (need === 0) txt = '✓ ถึงเป้าแล้ว';
    else if (noT) txt = 'ต้องเติม ' + need.toFixed(1) + ' kWh · เริ่มตอนนี้';
    else if (best) {
      const sl = avail - best.mins;
      dot = sl < 30 ? '🟠 ' : '🟢 ';
      txt = 'แนะนำ ' + best.c.a + 'A · ' + (sl === 0 ? 'ต้องเริ่มเดี๋ยวนี้' : 'เริ่มช้าที่สุดได้ถึง ' + when(best.start, now));
    } else {
      const f = rows[rows.length - 1];
      dot = '🔴 ';
      txt = 'ไม่ทัน ' + hm(target) + ' · เร็วสุด ' + f.c.a + 'A เสร็จ ' + when(f.end, now);
    }
    $('mini-t').textContent = dot + txt;
  }

  const bn = $('banner');
  if (need === 0) {
    bn.className = 'banner good';
    bn.textContent = 'แบตฯ ถึงเป้า ' + t + '% แล้ว ✓ ไม่ต้องชาร์จเพิ่ม';
  } else if (noT) {
    bn.className = 'banner info';
    bn.textContent = 'ชาร์จจาก ' + b + '% ถึง ' + t + '% ต้องเติมประมาณ ' + need.toFixed(1) + ' kWh · เริ่มตอนนี้';
  } else if (best) {
    bn.className = 'banner good';
    bn.textContent = 'แนะนำ ' + best.c.a + 'A: ชาร์จช้าที่สุดที่ยังเสร็จทัน ' + when(target, now) + ' เริ่มช้าที่สุดได้ถึง ' + when(best.start, now);
  } else {
    const fast = rows[rows.length - 1];
    bn.className = 'banner warn';
    bn.textContent = 'ชาร์จไม่ทันเวลา ' + when(target, now) + ' · เร็วที่สุด (' + fast.c.a + 'A) เริ่มตอนนี้จะเสร็จ ' + when(fast.end, now);
  }

  $('list').innerHTML = rows.map(r => {
    const c = r.c, isBest = best && best.c.a === c.a, isOpen = open.has(c.a);
    const sl0 = (!noT && r.ok && !r.done) ? avail - r.mins : null;
    const st = r.done ? ' st-done' : !r.ok ? ' st-late' : sl0 === null ? '' : sl0 < 30 ? ' st-tight' : ' st-ok';
    let l1, l2 = '';
    if (r.done) {
      l1 = '<span class="ok">ถึงเป้าแล้ว ✓</span>';
    } else {
      l1 = '<span class="dur">' + dur(r.mins) + '</span>' + (isBest ? '<span class="tag best">แนะนำ</span>' : '');
      if (r.ok) {
        if (!noT) {
          const sl = sl0;
          l1 += sl === 0 ? '<span class="tag tight">ต้องเริ่มเดี๋ยวนี้</span>'
            : '<span class="tag ' + (sl < 30 ? 'tight' : 'slack') + '">รอได้อีก ' + dur(sl) + '</span>';
        }
        l2 = (noT ? 'ตอนนี้ ' + hm(r.start) : when(r.start, now)) + ' → ' + when(r.end, now);
      } else {
        const late = Math.round((r.end - target) / 6e4);
        l1 += '<span class="tag late">ช้ากว่าเป้า ' + dur(late) + '</span>';
        l2 = 'เริ่มตอนนี้ → ' + when(r.end, now);
      }
    }
    const det = r.done ? '' :
      tlHtml(r) + '<div class="drow"><span>กำลังชาร์จจริง</span><span>' + c.i + ' ' + c.kw + ' kW</span></div>' +
      '<div class="drow"><span>พลังงานที่ต้องเติม</span><span>' + need.toFixed(1) + ' kWh</span></div>' +
      '<div class="drow"><span>' + (!noT && r.ok ? 'เริ่มช้าที่สุดได้ถึง' : 'เริ่มชาร์จ') + '</span><span>' + when(r.start, now) + '</span></div>' +
      '<div class="drow"><span>ชาร์จเสร็จ</span><span>' + when(r.end, now) + '</span></div>';
    return '<div class="item ' + c.c + st + (isBest ? ' best' : '') + (isOpen && !r.done ? ' open' : '') + '">' +
      '<button type="button" class="row" data-a="' + c.a + '"' + (r.done ? ' data-done="1"' : '') + ' aria-expanded="' + (isOpen && !r.done) + '">' +
      '<span class="badge">' + c.a + 'A</span>' +
      '<span class="main"><div class="l1">' + l1 + '</div>' + (l2 ? '<div class="l2">' + l2 + '</div>' : '') + '</span>' +
      (r.done ? '' : '<span class="chev">▼</span>') + '</button>' +
      '<div class="detail"><div class="detail-in">' + det + '</div></div></div>';
  }).join('');

  $('upd').textContent = 'คำนวณจากเวลา ' + hm(now) + ' น.';
  $('results').style.display = 'block';
  $('empty').style.display = 'none';
  hasRes = true; updMini();
  if (scroll) $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

['battery', 'tgt', 'target-time'].forEach(id => $(id).addEventListener('input', () => calc(false)));
$('no-time').addEventListener('change', () => calc(false));
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (c) { $('tgt').value = c.dataset.v; calc(false); }
});
$('list').addEventListener('click', e => {
  const r = e.target.closest('.row');
  if (!r || r.dataset.done) return;
  const a = +r.dataset.a, was = open.has(a);
  open.clear();
  if (!was) open.add(a);
  document.querySelectorAll('#list .item').forEach(it => {
    const bt = it.querySelector('.row'), on = open.has(+bt.dataset.a);
    it.classList.toggle('open', on);
    bt.setAttribute('aria-expanded', on);
  });
  save();
});
$('refresh').addEventListener('click', () => calc(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
    e.target.blur(); calc(true);
  }
});
setInterval(() => calc(false), 30000);

$('b-range').addEventListener('input', e => { $('battery').value = e.target.value; calc(false); });
const nudge = d => { const v = parseFloat($('battery').value); $('battery').value = Math.max(0, Math.min(99, Math.round((isNaN(v) ? 0 : v) + d))); calc(false); };
$('b-minus').addEventListener('click', () => nudge(-1));
$('b-plus').addEventListener('click', () => nudge(1));
$('carsel').addEventListener('click', e => { const b = e.target.closest('[data-car]'); if (b) { setCar(b.dataset.car); calc(false); } });
$('themes').addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (b) setTheme(b.dataset.th); });

let th = 'gold';
try { th = localStorage.getItem('byd_theme') || 'gold'; } catch (e) {}
setTheme(th);
load();
setCar(car);
calc(false);
</script>
</body>
</html>
